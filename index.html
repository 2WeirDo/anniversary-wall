<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Love Story — 拖拖 & 多多</title>
  <meta name="description" content="拖拖和多多恋爱一周年纪念 — 翻开属于我们的故事" />

  <!-- Open Graph / 社交分享 -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Our Love Story — 拖拖 & 多多" />
  <meta property="og:description" content="翻开属于我们的故事，每一页都是关于你。" />
  <meta property="og:image" content="https://2weirdo.github.io/anniversary-wall/og-cover.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="image/jpeg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Our Love Story — 拖拖 & 多多" />
  <meta name="twitter:description" content="翻开属于我们的故事，每一页都是关于你。" />
  <meta name="twitter:image" content="https://2weirdo.github.io/anniversary-wall/og-cover.jpg" />

  <!-- 主题色（浏览器 UI） -->
  <meta name="theme-color" content="#FEFCFB" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1A1520" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/anniversary-wall/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/anniversary-wall/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&family=Great+Vibes&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet" />

  <!-- 预加载前5张轮播缩略图：浏览器预加载扫描器在 HTML 解析阶段就开始下载
       绕过 SW 的 IndexedDB 开销，硬刷新时图片立即可见 -->
  <link rel="preload" as="image" href="/anniversary-wall/photos-optimized/photo1-small.webp" fetchpriority="high" />
  <link rel="preload" as="image" href="/anniversary-wall/photos-optimized/photo2-small.webp" fetchpriority="high" />
  <link rel="preload" as="image" href="/anniversary-wall/photos-optimized/photo3-small.webp" fetchpriority="high" />
  <link rel="preload" as="image" href="/anniversary-wall/photos-optimized/photo4-small.webp" fetchpriority="high" />
  <link rel="preload" as="image" href="/anniversary-wall/photos-optimized/photo5-small.webp" fetchpriority="high" />
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>

  <!-- 键盘用户跳过导航 -->
  <a href="#main-content" class="skip-link">跳到主内容</a>

  <!-- 阅读进度线 -->
  <div class="progress-bar" id="progress-bar">
    <div class="progress-bar-fill" id="progress-bar-fill"></div>
  </div>

  <!-- 暗夜模式切换 -->
  <button id="theme-toggle" class="theme-toggle" aria-label="切换暗夜模式">
    <svg class="theme-icon-moon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </svg>
    <svg class="theme-icon-sun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5" />
      <line x1="12" y1="1" x2="12" y2="3" />
      <line x1="12" y1="21" x2="12" y2="23" />
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
      <line x1="1" y1="12" x2="3" y2="12" />
      <line x1="21" y1="12" x2="23" y2="12" />
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
    </svg>
  </button>

  <!-- 回到顶部 -->
  <button id="back-to-top" class="back-to-top" aria-label="回到顶部">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 15l-6-6-6 6" />
    </svg>
  </button>

  <!-- 音乐控制按钮 -->
  <button id="music-btn" class="music-btn" aria-label="播放/暂停音乐">
    <svg class="music-icon-play" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="5 3 19 12 5 21 5 3" />
    </svg>
    <svg class="music-icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="4" width="4" height="16" />
      <rect x="14" y="4" width="4" height="16" />
    </svg>
  </button>

  <!-- 入场遮罩 -->
  <div id="entry-overlay" class="entry-overlay">
    <div class="entry-content">
      <div class="entry-line"></div>
      <p class="entry-kicker">拖拖 & 多多</p>
      <h2 class="entry-title">我们的故事</h2>
      <p class="entry-subtitle">Our Love Story</p>
      <div class="entry-divider"></div>
      <button id="enter-btn" class="enter-btn">
        <span>轻触开启</span>
        <svg class="enter-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14" />
          <path d="M12 5l7 7-7 7" />
        </svg>
      </button>
      <p class="entry-hint">向下滚动，翻开我们的故事</p>
    </div>
  </div>

  <!-- 页面导航点 -->
  <nav class="nav-dots" id="nav-dots" aria-label="页面导航">
    <span class="dot active" data-section="0" data-label="开场" aria-label="开场" role="button" tabindex="0"></span>
    <span class="dot" data-section="1" data-label="照片墙" aria-label="照片墙" role="button" tabindex="0"></span>
    <span class="dot" data-section="2" data-label="时间线" aria-label="时间线" role="button" tabindex="0"></span>
    <span class="dot" data-section="3" data-label="星愿清单" aria-label="星愿清单" role="button" tabindex="0"></span>
    <span class="dot" data-section="4" data-label="结尾" aria-label="结尾" role="button" tabindex="0"></span>
  </nav>

  <main id="main-content">
    <!-- ====== 板块1: Hero 开场 ====== -->
    <section id="hero" class="section hero" data-section="0">
      <div class="hero-particles" id="hero-particles"></div>
      <div class="hero-content">
        <div class="hero-bow-large">
          <svg viewBox="0 0 120 60" class="bow-svg">
            <path d="M10 30 Q30 5 60 30 Q90 5 110 30" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <circle cx="60" cy="30" r="8" fill="currentColor"/>
            <path d="M30 30 L10 55 L30 45 Z" fill="currentColor" opacity="0.7"/>
            <path d="M90 30 L110 55 L90 45 Z" fill="currentColor" opacity="0.7"/>
          </svg>
        </div>
        <h1 class="hero-title" id="hero-title">
          <span class="char">O</span><span class="char">u</span><span class="char">r</span>
          <span class="char-space"> </span>
          <span class="char">L</span><span class="char">o</span><span class="char">v</span><span class="char">e</span>
          <span class="char-space"> </span>
          <span class="char">S</span><span class="char">t</span><span class="char">o</span><span class="char">r</span><span class="char">y</span>
        </h1>
        <p class="hero-date">—— 拖拖和多多在一起的第 <span id="hero-days"></span> 天 ——</p>
        <div class="scroll-indicator">
          <span>向下滚动</span>
          <div class="scroll-arrow">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14"/>
              <path d="m5 12 7 7 7-7"/>
            </svg>
          </div>
        </div>
      </div>
    </section>

    <!-- ====== 板块2: 3D 旋转木马照片墙 ====== -->
    <section id="gallery" class="section gallery" data-section="1">
      <div class="gallery-header">
        <div class="section-divider"></div>
        <h2 class="section-title">我们的回忆</h2>
      </div>
      <div class="carousel-wrapper" id="carousel-wrapper">
        <button class="carousel-nav carousel-nav-prev" id="carousel-prev" aria-label="上一张">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="carousel-stage" id="carousel-stage">
          <div class="carousel-container" id="carousel-container">
            <!-- 照片由 JS 动态生成 -->
          </div>
          <!-- 故事气泡弹窗 -->
          <div class="story-bubble" id="story-bubble" aria-hidden="true" role="dialog" aria-modal="true" aria-label="照片故事">
            <div class="story-bubble-arrow"></div>
            <button class="story-bubble-close" id="story-bubble-close" aria-label="关闭">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
            <div class="story-bubble-body">
              <div class="story-bubble-flip" id="story-bubble-flip">
                <div class="story-bubble-front">
                  <p class="story-bubble-date" id="story-bubble-date"></p>
                  <p class="story-bubble-story" id="story-bubble-story"></p>
                </div>
                <div class="story-bubble-back">
                  <p class="story-bubble-flip-text" id="story-bubble-flip-text"></p>
                </div>
              </div>
            </div>
            <div class="story-bubble-footer">
              <button class="story-bubble-flip-btn" id="story-bubble-flip-btn" aria-label="翻转查看情话">
                <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <ellipse cx="30" cy="32" rx="22" ry="19" fill="#FFE4EC" stroke="#F0A0B8" stroke-width="1.5"/>
                  <ellipse cx="14" cy="18" rx="7" ry="9" fill="#FFE4EC" stroke="#F0A0B8" stroke-width="1.5"/>
                  <ellipse cx="14" cy="19" rx="4" ry="5.5" fill="#FFD0DD"/>
                  <ellipse cx="46" cy="18" rx="7" ry="9" fill="#FFE4EC" stroke="#F0A0B8" stroke-width="1.5"/>
                  <ellipse cx="46" cy="19" rx="4" ry="5.5" fill="#FFD0DD"/>
                  <circle cx="30" cy="12" r="4" fill="#F08090"/>
                  <ellipse cx="24" cy="11" rx="5" ry="3.5" fill="#F08090" transform="rotate(-20 24 11)"/>
                  <ellipse cx="36" cy="11" rx="5" ry="3.5" fill="#F08090" transform="rotate(20 36 11)"/>
                  <circle cx="29" cy="11" r="1.5" fill="#F8C0C8"/>
                  <ellipse cx="22" cy="30" rx="2.2" ry="2.8" fill="#333"/>
                  <circle cx="22.6" cy="29" r="0.7" fill="#fff"/>
                  <ellipse cx="38" cy="30" rx="2.2" ry="2.8" fill="#333"/>
                  <circle cx="38.6" cy="29" r="0.7" fill="#fff"/>
                  <ellipse cx="30" cy="36" rx="1.8" ry="1.3" fill="#F8C0C8"/>
                  <line x1="12" y1="33" x2="24" y2="35" stroke="#F0A0B8" stroke-width="0.8" stroke-linecap="round"/>
                  <line x1="12" y1="37" x2="24" y2="37" stroke="#F0A0B8" stroke-width="0.8" stroke-linecap="round"/>
                  <line x1="12" y1="41" x2="24" y2="39" stroke="#F0A0B8" stroke-width="0.8" stroke-linecap="round"/>
                  <line x1="48" y1="33" x2="36" y2="35" stroke="#F0A0B8" stroke-width="0.8" stroke-linecap="round"/>
                  <line x1="48" y1="37" x2="36" y2="37" stroke="#F0A0B8" stroke-width="0.8" stroke-linecap="round"/>
                  <line x1="48" y1="41" x2="36" y2="39" stroke="#F0A0B8" stroke-width="0.8" stroke-linecap="round"/>
                </svg>
              </button>
              <span class="story-bubble-counter" id="story-bubble-counter"></span>
            </div>
          </div>
        </div>
        <button class="carousel-nav carousel-nav-next" id="carousel-next" aria-label="下一张">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <div class="carousel-counter" id="carousel-counter">1 / 29</div>
        <!-- 轮播蒙层（气泡打开时不遮 active 卡片） -->
        <div class="carousel-veil" id="carousel-veil"></div>
      </div>
    </section>

    <!-- ====== 板块3: 恋爱时间线 ====== -->
    <section id="timeline" class="section timeline-section" data-section="2">
      <div class="section-divider"></div>
      <h2 class="section-title">我们的恋爱时光</h2>
      <div class="timeline" id="timeline-container">
        <!-- 时间线由 JS 动态生成 -->
      </div>
    </section>

    <!-- ====== 板块4: 星愿清单 ====== -->
    <section id="wishes" class="section wishes" data-section="3">
      <div class="wishes-container">
        <div class="wish-group">
          <h2 class="wish-group-head">
            <span class="wish-group-icon">✦</span>
            <span>已完成的约定</span>
          </h2>
          <p class="wish-group-sub">这些说好的事，我们都做到了</p>
          <div class="wish-cloud" id="wish-completed"></div>
        </div>
        <div class="wish-divider" aria-hidden="true">
          <!-- 串灯连接线 -->
          <svg class="wish-divider-svg" width="260" height="40" viewBox="0 0 260 40" fill="none">
            <!-- 曲线连接线 -->
            <path d="M0 20 Q65 8 130 20 Q195 32 260 20" stroke="currentColor" stroke-width="0.5" opacity="0.15" fill="none"/>
            <!-- 串灯光点 -->
            <circle cx="30" cy="16" r="2.5" fill="currentColor" opacity="0.3" class="fairy-light" style="animation-delay: 0s"/>
            <circle cx="65" cy="19" r="3.2" fill="currentColor" opacity="0.45" class="fairy-light" style="animation-delay: 0.4s"/>
            <circle cx="100" cy="23" r="2.8" fill="currentColor" opacity="0.4" class="fairy-light" style="animation-delay: 0.8s"/>
            <circle cx="130" cy="20" r="4" fill="currentColor" opacity="0.55" class="fairy-light fairy-light-main"/>
            <circle cx="160" cy="22" r="3" fill="currentColor" opacity="0.45" class="fairy-light" style="animation-delay: 1.2s"/>
            <circle cx="195" cy="19" r="2.5" fill="currentColor" opacity="0.35" class="fairy-light" style="animation-delay: 1.6s"/>
            <circle cx="230" cy="17" r="2" fill="currentColor" opacity="0.25" class="fairy-light" style="animation-delay: 2s"/>
            <!-- 光晕 -->
            <circle cx="130" cy="20" r="10" fill="currentColor" opacity="0.08" class="fairy-glow"/>
          </svg>
        </div>
        <div class="wish-group">
          <h2 class="wish-group-head">
            <span class="wish-group-icon">✧</span>
            <span>正在路上的愿望</span>
          </h2>
          <p class="wish-group-sub">还有很多故事，等着我们一起去写</p>
          <div class="wish-cloud" id="wish-pending"></div>
        </div>
      </div>
      <div class="wishes-fade" aria-hidden="true"></div>
    </section>

    <!-- ====== 板块5: 结尾 ====== -->
    <section id="ending" class="section ending" data-section="4">
      <div class="ending-particles" id="ending-particles"></div>
      <div class="ending-content">
        <button id="lantern-btn" class="lantern-btn">
          <span class="lantern-btn-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v4"/>
              <path d="M5 8h14a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1a2 2 0 0 1 2-2z"/>
              <path d="M7 13v4a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-4"/>
              <line x1="9" y1="6" x2="9" y2="8"/>
              <line x1="15" y1="6" x2="15" y2="8"/>
            </svg>
          </span>
          <span>放飞天灯</span>
        </button>
      </div>
    </section>
  </main>

  <!-- 底部签名 -->
  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
          <path d="m15 5 4 4"/>
        </svg>
      </span>
      <p class="footer-text">Made with love by 拖拖</p>
      <p class="footer-days">在一起的第 <span id="footer-days">—</span> 天</p>
    </div>
  </footer>


  <!-- 音频元素 -->
  <audio id="bgm-audio" loop preload="auto" style="display:none"></audio>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
