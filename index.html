<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Love Story — 拖拖 & 多多</title>
  <meta name="description" content="拖拖和多多恋爱一周年纪念 — 翻开属于我们的故事" />

  <!-- Open Graph / 社交分享 -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Our Love Story — 拖拖 & 多多" />
  <meta property="og:description" content="翻开属于我们的故事，每一页都是关于你。" />
  <meta property="og:image" content="https://2weirdo.github.io/anniversary-wall/og-cover.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="image/jpeg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Our Love Story — 拖拖 & 多多" />
  <meta name="twitter:description" content="翻开属于我们的故事，每一页都是关于你。" />
  <meta name="twitter:image" content="https://2weirdo.github.io/anniversary-wall/og-cover.jpg" />

  <!-- 主题色（浏览器 UI） -->
  <meta name="theme-color" content="#FEFCFB" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1A1520" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/anniversary-wall/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/anniversary-wall/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&family=Great+Vibes&family=Caveat:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>

  <!-- 阅读进度线 -->
  <div class="progress-bar" id="progress-bar">
    <div class="progress-bar-fill" id="progress-bar-fill"></div>
  </div>

  <!-- 暗夜模式切换 -->
  <button id="theme-toggle" class="theme-toggle" aria-label="切换暗夜模式">
    <svg class="theme-icon-moon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </svg>
    <svg class="theme-icon-sun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5" />
      <line x1="12" y1="1" x2="12" y2="3" />
      <line x1="12" y1="21" x2="12" y2="23" />
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
      <line x1="1" y1="12" x2="3" y2="12" />
      <line x1="21" y1="12" x2="23" y2="12" />
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
    </svg>
  </button>

  <!-- 音乐控制按钮 -->
  <button id="music-btn" class="music-btn" aria-label="播放/暂停音乐">
    <svg class="music-icon-play" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="5 3 19 12 5 21 5 3" />
    </svg>
    <svg class="music-icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="4" width="4" height="16" />
      <rect x="14" y="4" width="4" height="16" />
    </svg>
  </button>

  <!-- 入场遮罩 -->
  <div id="entry-overlay" class="entry-overlay">
    <div class="entry-content">
      <div class="entry-line"></div>
      <p class="entry-kicker">拖拖 & 多多</p>
      <h2 class="entry-title">我们的故事</h2>
      <p class="entry-subtitle">Our Love Story</p>
      <div class="entry-divider"></div>
      <button id="enter-btn" class="enter-btn">
        <span>轻触开启</span>
        <svg class="enter-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14" />
          <path d="M12 5l7 7-7 7" />
        </svg>
      </button>
      <p class="entry-hint">向下滚动，翻开我们的故事</p>
    </div>
  </div>

  <!-- 页面导航点 -->
  <nav class="nav-dots" id="nav-dots" aria-label="页面导航">
    <span class="dot active" data-section="0" aria-label="开场"></span>
    <span class="dot" data-section="1" aria-label="情书"></span>
    <span class="dot" data-section="2" aria-label="照片墙"></span>
    <span class="dot" data-section="3" aria-label="时间线"></span>
    <span class="dot" data-section="4" aria-label="结尾"></span>
  </nav>

  <main>
    <!-- ====== 板块1: Hero 开场 ====== -->
    <section id="hero" class="section hero" data-section="0">
      <div class="hero-bg"></div>
      <div class="hero-particles" id="hero-particles"></div>
      <div class="hero-content">
        <div class="hero-bow-large">
          <svg viewBox="0 0 120 60" class="bow-svg">
            <path d="M10 30 Q30 5 60 30 Q90 5 110 30" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <circle cx="60" cy="30" r="8" fill="currentColor"/>
            <path d="M30 30 L10 55 L30 45 Z" fill="currentColor" opacity="0.7"/>
            <path d="M90 30 L110 55 L90 45 Z" fill="currentColor" opacity="0.7"/>
          </svg>
        </div>
        <h1 class="hero-title" id="hero-title">
          <span class="char">O</span><span class="char">u</span><span class="char">r</span>
          <span class="char-space"> </span>
          <span class="char">L</span><span class="char">o</span><span class="char">v</span><span class="char">e</span>
          <span class="char-space"> </span>
          <span class="char">S</span><span class="char">t</span><span class="char">o</span><span class="char">r</span><span class="char">y</span>
        </h1>
        <p class="hero-date">—— 拖拖和多多在一起的第 <span id="hero-days"></span> 天 ——</p>
        <p class="hero-countdown">距离一周年还有 <span id="hero-countdown"></span> 天</p>
        <p class="hero-sub" id="hero-sub"></p>
        <div class="scroll-indicator">
          <span>向下滚动</span>
          <div class="scroll-arrow">↓</div>
        </div>
      </div>
    </section>

    <!-- ====== 板块2: 情书区 ====== -->
    <section id="letter" class="section letter" data-section="1">
      <div class="letter-container">
        <div class="letter-card">
          <!-- 蜡封 -->
          <div class="letter-seal" aria-hidden="true">
            <svg viewBox="0 0 60 60" class="letter-seal-svg">
              <circle cx="30" cy="30" r="28" fill="#E87890" stroke="#D4607A" stroke-width="2"/>
              <circle cx="30" cy="30" r="24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 3"/>
              <path d="M30 18C30 18 20 28 20 36C20 41.5 24.5 46 30 46C35.5 46 40 41.5 40 36C40 28 30 18 30 18Z" fill="#D4607A"/>
            </svg>
          </div>
          <!-- 信封撕边 -->
          <div class="letter-tear" aria-hidden="true"></div>
          <div class="letter-decoration top-left">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2" />
              <path d="M2 7l10 7 10-7" />
            </svg>
          </div>
          <div class="letter-body">
            <h2 class="letter-title"></h2>
            <div class="letter-ornament" aria-hidden="true">
              <svg width="120" height="16" viewBox="0 0 120 16">
                <line x1="0" y1="8" x2="45" y2="8" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
                <circle cx="52" cy="8" r="2.5" fill="currentColor" opacity="0.5"/>
                <path d="M58 8 Q60 3 62 8 Q64 13 66 8 Q68 3 70 8" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.4"/>
                <circle cx="74" cy="8" r="2.5" fill="currentColor" opacity="0.5"/>
                <line x1="81" y1="8" x2="120" y2="8" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
              </svg>
            </div>
            <div class="letter-text"></div>
            <div class="letter-ornament letter-ornament--bottom" aria-hidden="true">
              <svg width="120" height="12" viewBox="0 0 120 12">
                <path d="M40 6 Q50 2 60 6 Q70 10 80 6" fill="none" stroke="currentColor" stroke-width="0.6" opacity="0.4"/>
              </svg>
            </div>
            <div class="letter-sign">
              <span class="sign-flourish" aria-hidden="true">— ✦ —</span>
              <span class="sign-name"></span>
              <span class="sign-date"></span>
            </div>
          </div>
          <div class="letter-decoration bottom-right">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21C12 21 3 14 3 8.5C3 5.5 5.5 3.5 8 3.5C10 3.5 12 6 12 6C12 6 14 3.5 16 3.5C18.5 3.5 21 5.5 21 8.5C21 14 12 21 12 21Z" />
            </svg>
          </div>
        </div>
      </div>
    </section>

    <!-- ====== 板块3: 3D 旋转木马照片墙 ====== -->
    <section id="gallery" class="section gallery" data-section="2">
      <div class="gallery-header">
        <div class="section-divider"></div>
        <h2 class="section-title">我们的回忆</h2>
        <p class="section-sub">左右滑动，浏览我们的每一个珍贵瞬间</p>
      </div>
      <div class="carousel-wrapper">
        <div class="carousel-stage" id="carousel-stage">
          <div class="carousel-container" id="carousel-container">
            <!-- 照片由 JS 动态生成 -->
          </div>
        </div>
      </div>
    </section>

    <!-- ====== 板块4: 恋爱时间线 ====== -->
    <section id="timeline" class="section timeline-section" data-section="3">
      <div class="section-divider"></div>
      <h2 class="section-title">我们的恋爱时光</h2>
      <div class="timeline" id="timeline-container">
        <!-- 时间线由 JS 动态生成 -->
      </div>
    </section>

    <!-- ====== 板块5: 结尾 ====== -->
    <section id="ending" class="section ending" data-section="4">
      <div class="ending-particles" id="ending-particles"></div>
      <div class="ending-content">
        <div class="ending-heart">
          <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21C12 21 3 14 3 8.5C3 5.5 5.5 3.5 8 3.5C10 3.5 12 6 12 6C12 6 14 3.5 16 3.5C18.5 3.5 21 5.5 21 8.5C21 14 12 21 12 21Z" />
          </svg>
        </div>
        <h2 class="ending-title" id="ending-title"></h2>
        <p class="ending-days">拖拖和多多已经在一起</p>
        <p class="ending-days-counter" id="days-counter"></p>
        <p class="ending-days-label">天</p>
        <p class="ending-text" id="ending-text"></p>
        <p class="ending-text ending-text-large" id="ending-text-large"></p>
        <button id="lantern-btn" class="lantern-btn">
          <span>🏮</span>
          <span>放飞天灯</span>
        </button>
        <div class="ending-sign">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21C12 21 3 14 3 8.5C3 5.5 5.5 3.5 8 3.5C10 3.5 12 6 12 6C12 6 14 3.5 16 3.5C18.5 3.5 21 5.5 21 8.5C21 14 12 21 12 21Z" />
          </svg>
        </div>
      </div>
    </section>
  </main>

  <!-- 照片详情弹窗 -->
  <div id="photo-modal" class="photo-modal" aria-hidden="true">
    <div class="photo-modal-overlay"></div>
    <div class="photo-modal-content" role="dialog" aria-modal="true" aria-label="照片详情">
      <button class="photo-modal-close" id="modal-close" aria-label="关闭">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
      <div class="photo-modal-image" id="modal-photo-wrapper">
        <div class="photo-flip-container" id="photo-flip-container">
          <div class="photo-flip-front">
            <img id="modal-photo" src="" alt="" />
          </div>
          <div class="photo-flip-back">
            <div class="photo-flip-back-deco">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M12 21C12 21 3 14 3 8.5C3 5.5 5.5 3.5 8 3.5C10 3.5 12 6 12 6C12 6 14 3.5 16 3.5C18.5 3.5 21 5.5 21 8.5C21 14 12 21 12 21Z" /></svg>
            </div>
            <p class="photo-flip-back-text" id="modal-flip-text"></p>
            <div class="photo-flip-back-deco bottom">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M12 21C12 21 3 14 3 8.5C3 5.5 5.5 3.5 8 3.5C10 3.5 12 6 12 6C12 6 14 3.5 16 3.5C18.5 3.5 21 5.5 21 8.5C21 14 12 21 12 21Z" /></svg>
            </div>
          </div>
        </div>
      </div>
      <div class="photo-modal-info">
        <div class="photo-modal-date" id="modal-date"></div>
        <div class="photo-modal-story" id="modal-story"></div>
        <div class="photo-modal-counter" id="modal-counter"></div>
      </div>
      <div class="photo-modal-nav">
        <button class="photo-modal-nav-btn" id="modal-prev" aria-label="上一张">‹ 上一张</button>
        <button class="photo-modal-nav-btn" id="modal-next" aria-label="下一张">下一张 ›</button>
      </div>
    </div>
  </div>

  <!-- 音频元素 -->
  <audio id="bgm-audio" loop preload="auto" style="display:none"></audio>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
